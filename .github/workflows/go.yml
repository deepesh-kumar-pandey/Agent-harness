name: Go CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Build MCP test server
        run: |
          go build -o cmd/mcp-test-server/mcp-test-server ./cmd/mcp-test-server

      - name: Run tests
        run: go test -v ./...

      - name: Run vet
        run: go vet ./...